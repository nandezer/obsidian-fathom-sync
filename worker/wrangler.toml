# Cloudflare Worker configuration.
#
# This file is consumed by `wrangler deploy` AND by the "Deploy to Cloudflare"
# button on the README. Cloudflare's deploy-button UI reads `[vars]` and
# `[[kv_namespaces]]` to prompt the user for the values it needs.

name = "obsidian-fathom-sync"
main = "src/index.ts"
compatibility_date = "2026-04-01"

# KV namespace where we store delivered payloads. The Deploy button will
# auto-provision this in the user's account and inject the binding id.
[[kv_namespaces]]
binding = "DELIVERIES"
id = "REPLACE_WITH_KV_ID"
preview_id = "REPLACE_WITH_KV_ID"

# Variables prompted for at deploy time. These are NOT secrets and will end
# up in the deployed Worker config — fine because both are meant to be shared
# between the user and the Worker.
[vars]
# Token the plugin presents in the Authorization: Bearer header when polling
# /pending or calling /ack. Generated by the user (or auto-generated by the
# deploy UI) and pasted into plugin settings.
PLUGIN_BEARER_TOKEN = "set-me-at-deploy-time"

# Fathom-provided signing secret for verifying inbound webhook signatures.
# Fathom returns this in the response when you register the webhook via
# POST /external/v1/webhooks. The plugin auto-registration step will display
# the secret so the user can paste it into Cloudflare's secret store.
#
# Stored as a Worker secret in production:
#   wrangler secret put FATHOM_WEBHOOK_SECRET
#
# Listed here as a var only so the Deploy button can prompt for it.
FATHOM_WEBHOOK_SECRET = "set-me-at-deploy-time"
